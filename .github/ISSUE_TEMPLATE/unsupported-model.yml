name: Unsupported Nitro model
description: Request safe support for another Acer Nitro laptop
title: "[Model] Support for "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping another Nitro owner. Do not include a serial number or Acer SNID.
  - type: input
    id: model
    attributes:
      label: Exact model
      description: Output of `cat /sys/class/dmi/id/product_name`
      placeholder: Nitro AN515-57
    validations:
      required: true
  - type: input
    id: bios
    attributes:
      label: BIOS version
      description: Output of `cat /sys/class/dmi/id/bios_version`
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel version
      description: Output of `uname -r`
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Compatibility report
      description: Review and attach the JSON produced by `bin/nitro-report`.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked that my report has no serial number, SNID, hostname, username, or network address.
          required: true
